[workspace]
resolver = "3"
members = ["crates/ai", "crates/core", "crates/features", "crates/platform", "crates/runtime", "crates/app"]
exclude = ["spikes/gpui-editor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "2", features = ["unicode"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-segmentation = "1"
thiserror = "2"
gpui-kit = { version = "=0.9.1", features = ["tree-sitter-markdown"] }
