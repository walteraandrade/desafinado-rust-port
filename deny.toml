# cargo deny check: known vulnerabilities, licenses, banned or wildcard dependencies, and crate sources.
# Duplicate versions are allowed: GPUI's dependency tree pulls several and none are ours to pick.
# CI runs it on every pull request; run it locally with `cargo deny check` (cargo install cargo-deny).

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono is unmaintained, with no fix. GPUI and gpui-component depend on it too,
    # so dropping it waits on them; our own uses could move to jiff first.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, no fix; GPUI depends on it" },
    # zip 8 has extraction flaws fixed only in zip 9. harper-core 3.2 (the spell checker) pins zip ^8
    # for its Weirpack format, which the app never uses: nothing here opens or extracts an archive.
    # Approved by the maintainer on 2026-11-24; drop these once harper-core moves to zip 9.
    { id = "RUSTSEC-2026-0367", reason = "zip extraction flaw; harper-core pins zip 8, the app extracts no archives" },
    { id = "RUSTSEC-2026-0368", reason = "zip extraction flaw; harper-core pins zip 8, the app extracts no archives" },
    { id = "RUSTSEC-2026-0369", reason = "zip extraction flaw; harper-core pins zip 8, the app extracts no archives" },
    { id = "RUSTSEC-2026-0429", reason = "zip extraction flaw; harper-core pins zip 8, the app extracts no archives" },
    { id = "RUSTSEC-2026-0545", reason = "zip extraction flaw; harper-core pins zip 8, the app extracts no archives" },
    { id = "RUSTSEC-2026-0546", reason = "zip extraction flaw; harper-core pins zip 8, the app extracts no archives" },
    { id = "RUSTSEC-2026-0547", reason = "zip extraction flaw; harper-core pins zip 8, the app extracts no archives" },
    { id = "RUSTSEC-2026-0548", reason = "zip extraction flaw; harper-core pins zip 8, the app extracts no archives" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
