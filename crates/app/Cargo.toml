[package]
name = "desafinado"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
gpui-kit.workspace = true
serde_json.workspace = true
log.workspace = true
desafinado-core = { path = "../core" }
desafinado-ai = { path = "../ai" }
# The motion library, pinned to a revision of its GitHub repository.
ginga-gpui = { git = "https://github.com/walteraandrade/ginga", rev = "44f572c3b77355ce7a198e7af1797391915d98a1" }
futures = "0.3"
desafinado-platform = { path = "../platform" }
desafinado-runtime = { path = "../runtime" }
desafinado-features = { path = "../features" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rustix.workspace = true

[features]
# Writes GPUI's foreground journal to DESAFINADO_PERF_OUT, for performance runs.
perf-probe = ["gpui-kit/profiler"]

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
